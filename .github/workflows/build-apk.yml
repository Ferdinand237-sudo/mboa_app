name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Builder l'APK release
        run: flutter build apk --release

      - name: Publier l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: mboa-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # L'artifact ci-dessus est hébergé sur le stockage blob interne
      # d'Actions, injoignable depuis certains environnements réseau
      # restreints. Une Release GitHub sert le même fichier depuis
      # objects.githubusercontent.com, plus largement accessible.
      - name: Publier l'APK en Release GitHub
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-run-${{ github.run_number }}
          name: APK build #${{ github.run_number }} (${{ github.ref_name }})
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
